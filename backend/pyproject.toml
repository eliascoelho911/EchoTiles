[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "echotiles-backend"
version = "0.1.0"
description = "Biblioteca e geração rítmica do EchoTiles"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.38,<1",
  "librosa>=0.11,<0.12",
  "soundfile>=0.13,<0.14",
  "numpy>=2,<3",
  "yt-dlp==2026.11.24.232653.dev0",
  "yt-dlp-ejs==0.8.0",
  "psutil>=7,<8",
]

[project.scripts]
echotiles-backend = "echotiles_backend.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-cov>=7,<8", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/echotiles_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
